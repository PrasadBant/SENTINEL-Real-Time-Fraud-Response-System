version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0
    container_name: sentinel_neo4j
    ports:
      - "7474:7474" # Browser HTTP
      - "7687:7687" # Bolt port
    environment:
      - NEO4J_AUTH=neo4j/sentinelpass
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
