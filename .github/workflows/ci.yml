name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must match (or exceed) whatever trained/pickled
          # app/data/xgb_model.joblib — xgboost==3.3.0 (pinned in
          # requirements.txt) requires Python >=3.12. 3.11 here was an
          # arbitrary earlier choice that was never actually verified
          # against a clean install (see git history — CI caught it).
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

      - name: Dependency vulnerability scan (pip-audit)
        # Phase 2 (Security & Observability, minimal track). Fails the
        # job on a known vulnerability in any pinned dependency — no
        # extra config needed, pip-audit's default exit code is nonzero
        # on a finding. Scans the exact pinned versions in
        # requirements.txt, same environment pytest just ran against.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  secret-scan:
    # Separate job (no Python setup needed) so it runs in parallel with
    # backend-tests/frontend-build rather than adding to either's
    # critical path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans full history, not just the current commit
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
